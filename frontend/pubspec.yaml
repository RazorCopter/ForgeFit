name: forgefit
description: "Your AI-powered personal trainer."
publish_to: 'none'
version: 2.1.8+56

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # For the circular timer, we will use a standard AnimatedBuilder, no extra packages strictly required, 
  # or we use an external one if we want. We'll stick to native widgets for simplicity.
  cupertino_icons: ^1.0.2
  table_calendar: ^3.1.2
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  google_fonts: ^8.1.0
  url_launcher: ^6.2.6
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  http: ^1.2.1
  shimmer: ^3.0.0
  confetti: ^0.8.0
  audioplayers: ^6.0.0
  video_player: ^2.8.2
  local_auth: ^3.0.1
  sqflite: ^2.3.0
  js: ^0.7.2
  connectivity_plus: ^7.1.1
  wakelock_plus: ^1.5.2
  youtube_player_iframe: ^6.0.2
  lottie: ^3.1.0
  health: ^13.3.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/iconapk.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icona.png
    - assets/rilievo.jpg
    - assets/videos/
    - assets/lottie/
    - assets/achievements/
