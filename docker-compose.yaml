version: '3.8'

services:

  backend:
    build: ./backend
    container_name: forgefit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - TZ=Europe/Rome
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - forgefit-net

  frontend:
    build: ./frontend
    container_name: forgefit-frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - backend
    environment:
      - TZ=Europe/Rome
    networks:
      - forgefit-net

networks:
  forgefit-net:
    driver: bridge

volumes:
  backend_data:
